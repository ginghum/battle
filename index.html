<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>オートバトラー・シミュレーター</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #1a202c;
            color: #e2e8f0;
            overflow: hidden;
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
        }

        #game-container {
            flex: 1;
            position: relative;
            background-color: #2d3748;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #battlefield {
            position: relative;
            width: 800px;
            height: 800px;
            flex-shrink: 0;
            transform-origin: center center;
            border-radius: 50%;
            overflow: hidden; 
        }

        #battlefield-bg {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
            background-color: #4a5568; 
            border-radius: 50%; 
            border: 4px solid #718096;
            box-shadow: 0 0 20px rgba(0,0,0,0.5) inset;
            z-index: 1;
            transition: width 0.1s linear, height 0.1s linear;
        }

        #battlefield-floor {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #1a202c; 
            background-image: repeating-linear-gradient(45deg, rgba(255,0,0,0.05) 0, rgba(255,0,0,0.05) 15px, transparent 15px, transparent 30px);
            z-index: 0;
        }

        #danger-zone {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 50%, rgba(255, 0, 0, 0.3) 100%);
            border-radius: 50%;
            pointer-events: none;
        }

        .character {
            position: absolute;
            transform: translate(-50%, -50%);
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            cursor: pointer;
            z-index: 20;
            transition: transform 0.1s, filter 0.2s;
        }
        
        .character.hit {
            transform: translate(-50%, -50%) scale(1.2) rotate(10deg);
            filter: brightness(1.5) drop-shadow(0 0 5px red);
        }

        .character.invincible {
            filter: drop-shadow(0 0 10px #fef08a);
        }
        
        .character.frozen {
            filter: hue-rotate(180deg) brightness(1.2);
        }

        .hp-bar-container {
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 8px;
            background-color: #000;
            border-radius: 4px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .hp-bar-wrap { position: relative; width: 100%; height: 100%; }
        .hp-bar {
            height: 100%;
            background-color: #48bb78;
            width: 100%;
            transition: width 0.2s ease, background-color 0.2s ease;
        }
        .hp-bar.low { background-color: #e53e3e; }
        .hp-bar.med { background-color: #ecc94b; }
        
        .shield-bar {
            position: absolute;
            top: 0; left: 0;
            height: 100%;
            background-color: #63b3ed;
            opacity: 0.8;
            transition: width 0.2s ease;
        }

        .char-name-label {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 10px;
            color: white;
            text-shadow: 1px 1px 2px black;
            white-space: nowrap;
            pointer-events: none;
        }

        .damage-text {
            position: absolute;
            font-weight: bold;
            font-size: 14px;
            pointer-events: none;
            z-index: 50;
            animation: floatUp 1s ease-out forwards;
            text-shadow: 1px 1px 1px black;
        }
        .heal-text { color: #68d391; }
        
        @keyframes floatUp {
            0% { opacity: 1; transform: translate(-50%, -10px) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -40px) scale(1.5); }
        }

        .projectile { position: absolute; transform: translate(-50%, -50%); border-radius: 50%; z-index: 15; pointer-events: none; }
        .zone { position: absolute; transform: translate(-50%, -50%); border-radius: 50%; z-index: 5; pointer-events: none; }
        .tornado-effect { position: absolute; transform: translate(-50%, -50%); font-size: 40px; z-index: 18; pointer-events: none; animation: spin 0.5s linear infinite; }
        .beam-effect { position: absolute; transform-origin: left center; z-index: 16; pointer-events: none; opacity: 0.8; }
        .slash-effect { position: absolute; font-size: 30px; z-index: 25; pointer-events: none; transform: translate(-50%, -50%); animation: fadeOut 0.2s forwards; }
        .effect-text { position: absolute; font-weight: bold; z-index: 60; pointer-events: none; transform: translate(-50%, -50%); animation: flashFade 0.5s forwards; text-shadow: 0 0 5px currentColor; }

        @keyframes spin { 100% { transform: translate(-50%, -50%) rotate(360deg); } }
        @keyframes fadeOut { 100% { opacity: 0; } }
        @keyframes flashFade { 0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; } 50% { transform: translate(-50%, -50%) scale(1.5); } 100% { transform: translate(-50%, -50%) scale(2); opacity: 0; } }

        #sidebar {
            width: 380px;
            background-color: #2d3748;
            border-left: 1px solid #4a5568;
            display: flex;
            flex-direction: column;
            z-index: 40;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #2d3748; }
        ::-webkit-scrollbar-thumb { background: #4a5568; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #718096; }
        .hidden { display: none !important; }
        #game-container { min-width: 0; }
        #sidebar { flex-shrink: 0; }
        #start-overlay { padding: 20px; overflow-y: auto; }
        #name-input { width: min(500px, 100%); }
        #input-status { min-height: 24px; margin-bottom: 12px; color: #93c5fd; text-align: center; }
        #start-btn:disabled { opacity: .45; cursor: not-allowed; }
        .setup-actions { display: flex; gap: 12px; margin: 12px 0; }
        .setup-actions button { padding: 8px 12px; border: 1px solid #64748b; border-radius: 6px; }
        #speed-select { background: #374151; border-radius: 5px; padding: 6px; }
        @media (max-width: 760px) {
            body { flex-direction: column; height: 100dvh; }
            #game-container { flex: 1; min-height: 0; }
            #sidebar { width: 100%; height: 36dvh; border-left: 0; border-top: 1px solid #4a5568; }
            #start-overlay h1 { font-size: 24px; }
            #start-overlay p { margin-bottom: 12px; font-size: 12px; }
            #name-input { height: 90px; flex-shrink: 0; }
            #editor-panel { position: absolute; bottom: 0; width: 100%; height: 280px; z-index: 70; }
        }
    </style>
</head>
<body class="text-sm">

    <div id="game-container">
        <!-- 開始オーバーレイ -->
        <div id="start-overlay" class="absolute inset-0 bg-gray-900 bg-opacity-90 flex flex-col justify-center items-center z-50">
            <h1 class="text-4xl font-bold mb-4 text-white">オートバトラー<span class="text-yellow-400 text-xl ml-2">超絶進化版</span></h1>
            <p class="mb-6 text-gray-400 max-w-xl text-center leading-relaxed">
                2〜60人の名前をカンマ・読点・改行で入力してください。<br>
                名前を元に<strong>多彩なスキル</strong>を持つキャラクターが生成され、最後まで戦います。<br>
                <span class="text-red-400 font-bold">※50秒経過でサドンデスモード(攻撃力10倍/速度3倍)に突入します</span>
            </p>
            <textarea id="name-input" class="w-[500px] h-40 p-4 bg-gray-800 text-white border border-gray-600 rounded-md focus:outline-none focus:border-blue-500 mb-4 resize-none" placeholder="例: 勇者, 魔王, ドラゴン..."></textarea>
            <div id="input-status" role="status" aria-live="polite"></div>
            <div class="setup-actions">
                <button id="sample-btn" type="button">サンプルを入れる</button>
                <button id="reset-stats-btn" type="button">編集した能力をリセット</button>
            </div>
            <button id="start-btn" class="px-8 py-3 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-lg shadow-lg transition-transform transform hover:scale-105">
                バトル開始
            </button>
        </div>

        <!-- バトルエリア -->
        <div id="battlefield" class="hidden">
            <div id="battlefield-floor"></div>
            <div id="battlefield-bg">
                <div id="danger-zone"></div>
            </div>
        </div>
        
        <div id="time-stop-overlay" class="hidden absolute inset-0 bg-purple-900 bg-opacity-30 pointer-events-none z-40 transition-opacity duration-300">
            <div class="absolute inset-0 flex items-center justify-center text-white opacity-20 text-9xl font-black font-serif italic" style="letter-spacing: 0.5em;">TIME STOP</div>
        </div>

        <div id="game-over-overlay" class="hidden absolute inset-0 bg-black bg-opacity-80 flex flex-col justify-center items-center z-50">
            <h2 class="text-5xl font-bold text-yellow-400 mb-2 drop-shadow-lg">WINNER!</h2>
            <div id="winner-display" class="text-[80px] mb-6">👑</div>
            <h3 id="winner-name" class="text-4xl text-white font-bold mb-8"></h3>
            <button id="restart-btn" class="px-6 py-2 bg-gray-700 hover:bg-gray-600 text-white rounded shadow text-lg font-bold">もう一度遊ぶ</button>
        </div>
    </div>

    <!-- サイドバー -->
    <div id="sidebar" class="h-full">
        <div class="p-4 border-b border-gray-600 bg-gray-800 flex justify-between items-center">
            <h2 class="text-xl font-bold">参加者リスト</h2>
            <span id="alive-count" class="bg-blue-900 text-blue-200 px-2 py-1 rounded text-xs font-bold">0 / 0 生存</span>
        </div>
        
        <div id="character-list" class="flex-1 overflow-y-auto p-2"></div>

        <div id="editor-panel" class="hidden border-t border-gray-600 bg-gray-800 p-4 h-64 overflow-y-auto">
            <div class="flex justify-between items-center mb-2">
                <h3 class="font-bold text-lg text-blue-300">キャラクター編集</h3>
                <button id="close-editor-btn" class="text-gray-400 hover:text-white text-2xl leading-none">&times;</button>
            </div>
            
            <div id="editor-content" class="space-y-3">
                <div class="flex items-center space-x-3">
                    <div id="edit-avatar" class="text-3xl"></div>
                    <div class="font-bold text-xl" id="edit-name"></div>
                </div>
                
                <div class="grid grid-cols-2 gap-2 text-xs">
                    <div>
                        <label class="block text-gray-400">攻撃力 (ATK)</label>
                        <input type="number" id="edit-atk" class="w-full bg-gray-700 text-white px-2 py-1 rounded border border-gray-600">
                    </div>
                    <div>
                        <label class="block text-gray-400">最大体力 (HP)</label>
                        <input type="number" id="edit-maxhp" class="w-full bg-gray-700 text-white px-2 py-1 rounded border border-gray-600">
                    </div>
                    <div>
                        <label class="block text-gray-400">速度 (SPD) ※最大200</label>
                        <!-- max 200を追加 -->
                        <input type="number" id="edit-spd" class="w-full bg-gray-700 text-white px-2 py-1 rounded border border-gray-600" step="0.1" max="200">
                    </div>
                    <div class="col-span-2">
                        <label class="block text-gray-400">スキル</label>
                        <select id="edit-skill" class="w-full bg-gray-700 text-white px-2 py-1 rounded border border-gray-600 text-xs"></select>
                    </div>
                </div>
                <button id="save-edit-btn" class="w-full mt-2 py-2 bg-green-600 hover:bg-green-500 rounded text-white font-bold">保存して適用</button>
            </div>
        </div>
        
        <div class="p-4 border-t border-gray-600 bg-gray-900 flex justify-between items-center flex-wrap gap-2">
            <div class="flex gap-2">
                <button id="pause-btn" class="px-4 py-2 bg-yellow-600 hover:bg-yellow-500 text-white font-bold rounded shadow disabled:opacity-50" disabled>一時停止</button>
                <button id="shuffle-btn" class="px-4 py-2 bg-purple-600 hover:bg-purple-500 text-white font-bold rounded shadow disabled:opacity-50">能力シャッフル</button>
                <button id="stop-btn" class="px-4 py-2 bg-red-600 hover:bg-red-500 text-white font-bold rounded shadow hidden">中断</button>
            </div>
             <label>再生速度 <select id="speed-select" aria-label="再生速度"><option value="0.5">0.5倍</option><option value="1" selected>1倍</option><option value="2">2倍</option><option value="4">4倍</option></select></label>
             <div class="text-sm font-mono text-gray-400">
                 ⏱ <span id="game-time" class="text-lg">00:00</span>
             </div>
        </div>
    </div>

        function escapeHTML(value) {
            return String(value).replace(/[&<>"']/g, c => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'}[c]));
        }
        function parseNames(value) {
            return [...new Set(value.split(/[,，\n、]/).map(n => n.trim()).filter(Boolean))];
        }
        function saveSettings() {
            try { localStorage.setItem(STORAGE_KEY, JSON.stringify({names: ui.nameInput.value, stats: [...customStats]})); }
            catch (error) { console.warn('設定を保存できませんでした', error); }
        }
        function updateInputStatus() {
            const count = parseNames(ui.nameInput.value).length;
            ui.startBtn.disabled = count < 2 || count > MAX_PLAYERS;
            document.getElementById('input-status').textContent = count > MAX_PLAYERS
                ? `${count}人入力されています。60人以下にしてください。`
                : `${count} / ${MAX_PLAYERS}人${count < 2 ? ' — 2人以上入力してください' : ' — 準備完了（同名は1人として扱います）'}`;
        }
        function scheduleTimeout(callback, delay, owner = null) {
            const timer = {callback, remaining: delay, interval: 0, owner};
            simulationTimers.add(timer);
            return timer;
        }
        function scheduleInterval(callback, delay, owner = null) {
            const timer = {callback, remaining: delay, interval: delay, owner};
            simulationTimers.add(timer);
            return timer;
        }
        function runSimulationTimers() {
            for (const timer of [...simulationTimers]) {
                if (!isPlaying) break;
                if (!simulationTimers.has(timer)) continue;
                if (timer.owner && timeStopState.active && timer.owner.teamId !== timeStopState.ownerTeam) continue;
                timer.remaining -= TICK_RATE;
                if (timer.remaining > 1e-7) continue;
                if (timer.interval) timer.remaining += timer.interval;
                else simulationTimers.delete(timer);
                timer.callback();
            }
        }
        function stopLoop() {
            cancelAnimationFrame(gameLoopId);
            gameLoopId = null;
            frameTime = null;
            accumulatedTime = 0;
        }
        function animationFrame(timestamp) {
            if (!isPlaying) { stopLoop(); return; }
            if (frameTime === null) frameTime = timestamp;
            accumulatedTime += Math.min(100, timestamp - frameTime) * playbackSpeed;
            frameTime = timestamp;
            let steps = 0;
            while (accumulatedTime + 1e-7 >= TICK_RATE && isPlaying && steps++ < 24) {
                accumulatedTime -= TICK_RATE;
                gameLoop();
            }
            if (isPlaying) gameLoopId = requestAnimationFrame(animationFrame);
        }
        function startLoop() {
            stopLoop();
            gameLoopId = requestAnimationFrame(animationFrame);
        }

        function cyrb53(str, seed = 0) {
            let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
            for (let i = 0, ch; i < str.length; i++) {
                ch = str.charCodeAt(i);
                h1 = Math.imul(h1 ^ ch, 2654435761);
                h2 = Math.imul(h2 ^ ch, 1597334677);
            }
            h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
            h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
            return 4294967296 * (2097151 & h2) + (h1 >>> 0);
        }

        function mulberry32(a) {
            return function() {
              var t = a += 0x6D2B79F5;
              t = Math.imul(t ^ t >>> 15, t | 1);
              t ^= t + Math.imul(t ^ t >>> 7, t | 61);
              return ((t ^ t >>> 14) >>> 0) / 4294967296;
            }
        }

        function getDistance(p1, p2) {
            const dx = p1.x - p2.x;
            const dy = p1.y - p2.y;
            return Math.sqrt(dx * dx + dy * dy);
        }

        class Character {
            constructor(name, randFunc, isMinion = false, parentTeamId = null, assignedSkillId = null) {
                this.id = 'char_' + (charIdCounter++);
                this.name = name;
                this.teamId = parentTeamId || this.id;
                this.isMinion = isMinion;
                this.isFragment = false; 
                this.weakEndTime = 0; 
                this.sevenAttackCount = 0; 
                this.hasSummonedKnight = false; 
                
                if (randFunc) {
                    this.avatar = isMinion ? PET_AVATARS[Math.floor(randFunc() * PET_AVATARS.length)] : AVATARS[Math.floor(randFunc() * AVATARS.length)];
                    const basePool = randFunc();
                    
                    if (basePool < 0.33) { this.atk = 15 + randFunc() * 10; this.maxHp = 1000 + randFunc() * 200; this.speed = 4.5 + randFunc() * 1.5; }
                    else if (basePool < 0.66) { this.atk = 8 + randFunc() * 10; this.maxHp = 1200 + randFunc() * 300; this.speed = 4.0 + randFunc() * 1.0; }
                    else { this.atk = 10 + randFunc() * 8; this.maxHp = 1000 + randFunc() * 150; this.speed = 5.5 + randFunc() * 1.5; }
                    
                    if (isMinion) {
                        this.atk *= 0.1; this.maxHp *= 0.1; this.skill = 'none';
                    } else {
                        this.skill = assignedSkillId || 'none';
                    }
                } else {
                    this.avatar = '👤'; this.atk = 10; this.maxHp = 1000; this.speed = 5.0; this.skill = 'none';
                }

                if (SUPPORT_SKILLS.includes(this.skill) && !this.isMinion) {
                    this.maxHp *= 1.5;
                }

                if (this.skill === 'extra_life') {
                    this.maxHp *= 0.8; 
                }

                if (!isMinion && customStats.has(this.name)) {
                    this.skill = customStats.get(this.name).skill;
                }

                this.radius = 16;
                this.isFlying = this.skill === 'flying';
                this.hasExtraLife = false;
                this.bikeHp = 0;
                this.knightRef = null;
                
                if (this.skill === 'giant') {
                    this.radius = 36; this.maxHp *= 2.5; this.atk *= 2.0; this.speed *= 0.8;
                } else if (this.skill === 'super_knockback') {
                    this.atk *= 1.5;
                } else if (this.skill === 'extra_life') {
                    this.hasExtraLife = true;
                } else if (this.skill === 'bike_ride') {
                    this.bikeHp = this.maxHp * 1.5;
                    this.avatar = '🏍️';
                    this.speed *= 1.5;
                }

                if (!isMinion && customStats.has(this.name)) {
                    const saved = customStats.get(this.name);
                    this.atk = saved.atk;
                    this.maxHp = saved.maxHp;
                    this.speed = saved.speed;
                    this.skill = saved.skill;
                }
                if (this.skill === 'bike_ride') this.bikeHp = this.maxHp * 1.5;
                this.hp = this.maxHp;
                this.shield = this.skill === 'shield' ? this.maxHp * 0.5 : 0;
                this.maxShield = this.shield;
                this.isAlive = true;
                
                this.isInvincible = false;
                this.stunEndTime = 0;
                this.chainBindEndTime = 0; 
                this.nullifyEndTime = 0;
                this.berserkActive = false; 
                this.vampireActive = false; 
                this.wizardEndTime = 0;
                this.hasteEndTime = 0;
                this.isUnderground = false;
                this.flightEndTime = 0;
                this.jetDashEndTime = 0;
                this.teleportInvincibleEndTime = 0; 
                this.sonicInvincibleEndTime = 0;    
                
                this.usedBurstHeal = false;
                this.usedExpandDomain = false;

                const r = Math.random() * (BATTLEFIELD_SIZE / 4);
                const angle = Math.random() * Math.PI * 2;
                this.x = BATTLEFIELD_SIZE / 2 + Math.cos(angle) * r;
                this.y = BATTLEFIELD_SIZE / 2 + Math.sin(angle) * r;

                const moveAngle = Math.random() * Math.PI * 2;
                this.vx = Math.cos(moveAngle) * this.speed;
                this.vy = Math.sin(moveAngle) * this.speed;
                
                this.element = null;
                this.hpBarElement = null;
