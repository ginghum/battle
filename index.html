            updatePosition() {
                if(!this.element) return;
                this.element.style.left = `${this.x}px`;
                this.element.style.top = `${this.y}px`;
            }

            updateUI() {
                if(!this.isAlive || !this.element) return;
                
                const hpPercent = Math.max(0, (this.hp / this.maxHp) * 100);
                this.hpBarElement.style.width = `${hpPercent}%`;
                this.hpBarElement.className = 'hp-bar';
                if (hpPercent < 30) this.hpBarElement.classList.add('low');
                else if (hpPercent < 60) this.hpBarElement.classList.add('med');

                if (this.bikeHp > 0) {
                    this.shieldBarElement.style.width = `${(this.bikeHp / (this.maxHp * 1.5)) * 100}%`;
                } else if (this.maxShield > 0) {
                    this.shieldBarElement.style.width = `${Math.max(0, (this.shield / this.maxShield) * 100)}%`;
                } else {
                    this.shieldBarElement.style.width = '0%';
                }

                if(this.listItemElement && !this.isMinion && gameTime - this.lastListUpdate >= 200) {
                    this.lastListUpdate = gameTime;
                    const skillObj = SKILLS.find(s => s.id === this.skill);
                    this.updateListItemHTML(this.listItemElement, skillObj);
                }
                
                this.element.style.opacity = this.isUnderground ? '0.3' : '1';
                this.element.classList.toggle('frozen', this.stunEndTime > gameTime);
                this.element.classList.toggle('invincible', this.isInvincibleState());
                
                if (this.flightEndTime > gameTime) {
                    this.element.style.transform = `translate(-50%, -50%) scale(1.8)`;
                    this.element.style.zIndex = '30';
                } else {
                    this.element.style.transform = `translate(-50%, -50%) scale(1)`;
                    this.element.style.zIndex = '20';
                }
                
                let filter = '';
                if (this.berserkActive) filter += 'drop-shadow(0 0 10px red) ';
                if (this.vampireActive) filter += 'drop-shadow(0 0 10px purple) ';
                if (this.nullifyEndTime > gameTime) filter += 'grayscale(100%) ';
                if (this.weakEndTime > gameTime) filter += 'sepia(100%) hue-rotate(-50deg) saturate(3) ';
                this.element.style.filter = filter || '';
            }

            isInvincibleState() {
                if (this.isInvincible) return true;
                const aliveTeams = new Set(characters.filter(c => c.isAlive && (!c.isMinion || c.isFragment)).map(c => c.teamId)).size;
                if (this.skill === 'final_five_invincible' && aliveTeams <= 5) return true;
                if (this.skill === 'invincible_until_first_death' && !hasFirstDeathOccurred) return true;
                if (this.skill === 'summon_knight' && this.knightRef && this.knightRef.isAlive) return true;
                if (timeSlowState.active && timeSlowState.ownerTeam === this.teamId) return true;
                if (this.flightEndTime > gameTime) return true;
                if (this.hasteEndTime > gameTime) return true; 
                if (this.teleportInvincibleEndTime > gameTime) return true;
                if (this.sonicInvincibleEndTime > gameTime) return true;
                
                return false;
            }

            takeDamage(amount, isCritical = false, attacker = null, isPiercing = false) {
                if(!this.isAlive || this.isUnderground) return;

                let isActuallyInvincible = this.isInvincibleState();

                if (isActuallyInvincible && !isPiercing) {
                    showFloatingText(this.x, this.y, 'BLOCK!', 'text-yellow-300');
                    return;
                }

                let dodgeChance = this.skill === 'dodge' ? 0.15 : 0;
                if (Math.random() < dodgeChance && !isPiercing) {
                    showFloatingText(this.x, this.y, 'Miss!', 'text-gray-300');
                    return;
                }

                if (this.skill === 'invincible_chance' && Math.random() < 0.05 && !isPiercing) {
                    this.isInvincible = true;
                    showFloatingText(this.x, this.y, '無敵化!', 'text-yellow-400');
                    scheduleTimeout(() => { this.isInvincible = false; this.updateUI(); }, 3000, this);
                    return;
                }

                if (attacker && attacker.isAlive) {
                    const mySpeed = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
                    const atkSpeed = Math.sqrt(attacker.vx*attacker.vx + attacker.vy*attacker.vy);
                    if (mySpeed > atkSpeed) {
                        const diff = mySpeed - atkSpeed;
                        const reduction = Math.min(0.8, diff * 0.15);
                        amount *= (1 - reduction);
                    }
                }

                if (this.berserkActive) amount *= 0.5;
                if (this.vampireActive) amount *= 0.5; 
                if (this.skill === 'defense_x2') amount /= 2;
                if (this.weakEndTime > gameTime) amount *= 1.5; 
                if (this.chainBindEndTime > gameTime) amount *= 10.0; 

                if (this.bikeHp > 0) {
                    if (this.bikeHp >= amount) { this.bikeHp -= amount; amount = 0; }
                    else { amount -= this.bikeHp; this.bikeHp = 0; this.avatar = '👤'; createEffect('effect-text', this.x, this.y, '💥', 500); }
                } else if (this.shield > 0) {
                    if (this.shield >= amount) { this.shield -= amount; amount = 0; }
                    else { amount -= this.shield; this.shield = 0; }
                }
                
                this.hp -= amount;
                
                if (amount > 0) {
                    this.element.classList.add('hit');
                    setTimeout(() => { if(this.element) this.element.classList.remove('hit'); }, 100);
                    const colorClass = isCritical ? 'text-red-500 font-black text-lg' : 'text-red-300';
                    showFloatingText(this.x, this.y, `-${Math.ceil(amount)}${isCritical?'!':''}`, colorClass);
                    
                    if (this.skill === 'counter_damage' && attacker && attacker.isAlive && !isPiercing) {
                        attacker.takeDamage(amount * 0.3, false, null);
                        showFloatingText(this.x, this.y, 'Counter!', 'text-orange-400');
                    }
                }

                this.updateUI();

                if (this.hp <= 0) {
                    if (this.hasExtraLife) {
                        this.hp = this.maxHp;
                        this.hasExtraLife = false;
                        createEffect('effect-text text-pink-500', this.x, this.y, 'REVIVE!', 1000);
                        this.updateUI();
                    } else {
                        this.die(attacker);
                    }
                }
            }

            heal(amount) {
                if(!this.isAlive) return;
                const actualHeal = Math.min(this.maxHp - this.hp, amount);
                if (actualHeal <= 0) return;
                this.hp += actualHeal;
                showFloatingText(this.x, this.y, `+${Math.ceil(actualHeal)}`, 'heal-text font-bold');
                this.updateUI();
            }
            
            triggerWeaponHeal() {
                if (this.isAlive) {
                    this.heal(this.maxHp * 0.01);
                }
            }

            die(attacker) {
                this.isAlive = false;
                this.hp = 0;
                
                if (!this.isMinion && !this.isFragment) {
                    hasFirstDeathOccurred = true;
                }
                
                if (this.skill === 'explosion') {
                    createEffect('effect-text text-orange-500', this.x, this.y, '💥', 500, 'font-size:120px;');
                    characters.forEach(c => {
                        if (c.isAlive && c.teamId !== this.teamId && getDistance(this, c) < 250 && c.skill !== 'nullify') c.takeDamage(this.atk * 9.0, false, this);
                    });
                }
                
                if (this.skill === 'destiny_bond' && attacker && attacker.isAlive && attacker.skill !== 'nullify') {
                    createEffect('effect-text text-purple-800', attacker.x, attacker.y, '💀道連れ', 1000);
                    attacker.takeDamage(99999, true, this, true); 
                }

                if (this.skill === 'split_on_death') {
                    for(let i=0; i<10; i++) {
                        const clone = new Character(this.name + ' (破片)', null, true, this.teamId);
                        clone.isFragment = true;
                        clone.x = this.x + (Math.random()-0.5)*40; clone.y = this.y + (Math.random()-0.5)*40;
                        clone.avatar = this.avatar; clone.maxHp = this.maxHp * 0.2; clone.hp = clone.maxHp; 
                        clone.atk = this.atk * 0.5; clone.speed = this.speed * 1.5; clone.radius = 10;
                        characters.push(clone); clone.createDOM();
                    }
                }

                if (attacker && attacker.isAlive && attacker.skill === 'triumph') {
                    createEffect('effect-text text-yellow-400', attacker.x, attacker.y, 'LEVEL UP!', 1000);
                    attacker.heal(attacker.maxHp * 0.3); 
                    attacker.atk *= 1.1; 
                }

                if (this.element) {
                    this.element.style.transform = 'translate(-50%, -50%) scale(0) rotate(180deg)';
                    this.element.style.opacity = '0';
                    setTimeout(() => { if(this.element) this.element.remove(); }, 500);
                }
                
                if (this.listItemElement && !this.isMinion) {
                    this.updateListItemHTML(this.listItemElement, SKILLS.find(skill => skill.id === this.skill) || SKILLS[0]);
                    this.listItemElement.classList.add('opacity-50', 'grayscale');
                    this.listItemElement.querySelector('.font-bold').classList.add('line-through');
                }
                // 勝敗は全員の死亡・分裂処理を終えたフレーム末に判定する。
            }

            normalizeSpeed() {
                let currentSpeed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                let targetSpeed = this.speed;
                
                if (this.berserkActive) targetSpeed *= 1.5;
                if (this.vampireActive) targetSpeed *= 1.5;
                if (this.hasteEndTime > gameTime) targetSpeed *= 1.3;
                
                if (this.skill === 'invincible_until_first_death' && !hasFirstDeathOccurred) targetSpeed *= 0.5;
                if (timeSlowState.active && timeSlowState.ownerTeam !== this.teamId) targetSpeed *= 0.5;
                if (this.weakEndTime > gameTime) targetSpeed *= 0.5;

                if (this.skill === 'summon_knight' && this.knightRef && this.knightRef.isAlive) targetSpeed = 1.0;
                
                if (timeStopState.active && timeStopState.ownerTeam === this.teamId) targetSpeed *= 5.0;

                // 速度の最大値を200に制限
                targetSpeed = Math.min(targetSpeed, 200);

                if (currentSpeed > 0) {
                    this.vx = (this.vx / currentSpeed) * targetSpeed;
                    this.vy = (this.vy / currentSpeed) * targetSpeed;
                } else {
                    const angle = Math.random() * Math.PI * 2;
                    this.vx = Math.cos(angle) * targetSpeed;
                    this.vy = Math.sin(angle) * targetSpeed;
                }
            }

            checkCooldown(skillKey, interval) {
                if (!this.lastSkills[skillKey]) this.lastSkills[skillKey] = 0;
                const adjustedInterval = (this.wizardEndTime > gameTime) ? interval * 0.2 : interval;
                if (gameTime - this.lastSkills[skillKey] > adjustedInterval) {
                    this.lastSkills[skillKey] = gameTime;
                    return true;
                }
                return false;
            }

            getNearestEnemy() {
                let nearest = null; let minDist = Infinity;
                for (let c of characters) {
                    if (c.isAlive && c.teamId !== this.teamId && !c.isUnderground) {
                        const d = getDistance(this, c);
                        if (d < minDist) { minDist = d; nearest = c; }
                    }
                }
                return nearest;
            }

            act() {
                if (!this.isAlive) return;
                if (timeStopState.active && timeStopState.ownerTeam !== this.teamId) return;
                
                if (this.skill !== 'nullify' && this.stunEndTime > gameTime) { 
                    this.updatePosition(); 
                    return; 
                }
                
                const isNullified = (this.nullifyEndTime > gameTime && this.skill !== 'nullify');
                let activeSkill = this.skill;
                const isWizardMagic = (this.skill === 'wizard_mode' && activeSkill !== 'wizard_mode');

                if (this.wizardEndTime > gameTime) {
                    // 追加能力を含める場合もあるが基本魔法に限定
                    const magicSkills = ['ranged_shot', 'random_lightning', 'flamethrower', 'rainbow_beam', 'tornado', 'freeze_aura', 'emoji_launcher'];
                    activeSkill = magicSkills[Math.floor(Math.random() * magicSkills.length)];
                }

                if (!isNullified) {
                    if (activeSkill === 'scaling_atk') this.atk += 0.03; 
                    if (activeSkill === 'scaling_spd') this.speed = Math.min(this.speed + 0.015, 200); 
                    if (activeSkill === 'regeneration' && gameTime % 1000 < TICK_RATE) this.heal(this.maxHp * 0.02);
                    
                    if (activeSkill === 'self_heal' && !this.usedBurstHeal && this.hp < this.maxHp * 0.3) {
                        this.usedBurstHeal = true; this.heal(this.maxHp * 0.5); createEffect('effect-text text-green-400', this.x, this.y, 'FULL HEAL!', 1000);
                    }

                    if (activeSkill === 'berserk' && !this.berserkActive && this.hp < this.maxHp * 0.3) {
                        this.berserkActive = true; 
                        createEffect('effect-text text-red-600', this.x, this.y, 'BERSERK!!', 2000);
                    }
                    
                    if (activeSkill === 'vampire_lord' && !this.vampireActive && this.hp < this.maxHp * 0.5) {
                        this.vampireActive = true; 
                        createEffect('effect-text text-rose-700', this.x, this.y, 'BLOOD!', 2000);
                    }

                    if (activeSkill === 'spinning_blade') {
                        createEffect('tornado-effect text-gray-300', this.x, this.y, '⚙️', TICK_RATE*2, `width:${this.radius*4}px;height:${this.radius*4}px;`);
                        if (gameTime % 200 < TICK_RATE) {
                            characters.forEach(c => {
                                if (c.isAlive && c.teamId !== this.teamId && c.skill !== 'nullify' && getDistance(this, c) < this.radius*3.5) {
                                    c.takeDamage(this.atk * 0.2, false, this);
                                    this.triggerWeaponHeal();
                                }
                            });
                        }
                    }

                    if (activeSkill === 'death_stare') {
                        characters.forEach(c => {
                            if (c.isAlive && c.teamId !== this.teamId && getDistance(this, c) < 100) {
                                let time = this.stareTargets.get(c.id) || 0;
                                time += TICK_RATE;
                                this.stareTargets.set(c.id, time);
                                if (time > 2000) { 
                                    if(c.skill !== 'nullify') c.takeDamage(99999, true, this); 
                                    this.stareTargets.set(c.id, 0); 
                                }
                            } else {
                                this.stareTargets.set(c.id, 0);
                            }
                        });
                    }

                    if (activeSkill === 'border_spikes') globalSpikesActive = true;

                    if (activeSkill === 'ranged_shot' && this.checkCooldown('ranged', 1000)) {
                        const target = this.getNearestEnemy();
                        if (target) {
                            const angle = Math.atan2(target.y - this.y, target.x - this.x);
                            gameObjects.push(new Projectile(this, angle, 'text-gray-300', '●', 10, this.atk * 2.4, true));
                        }
                    }

                    if (activeSkill === 'emoji_launcher' && this.checkCooldown('emoji_launcher', 1500)) {
                        const target = this.getNearestEnemy();
                        if (target) {
                            const angle = Math.atan2(target.y - this.y, target.x - this.x);
                            const face = EMOJI_FACES[Math.floor(Math.random() * EMOJI_FACES.length)];
                            gameObjects.push(new Projectile(this, angle, 'text-yellow-400 font-bold', face, 12, this.atk * 8.0, true));
                        }
                    }

                    if (activeSkill === 'gatling' && this.checkCooldown('gatling_main', 3000)) {
                        const target = this.getNearestEnemy();
                        if (target) {
                            this.gatlingShots = 15;
                            this.gatlingTargetAngle = Math.atan2(target.y - this.y, target.x - this.x);
                        }
                    }
                    if (this.gatlingShots > 0 && gameTime % 100 < TICK_RATE * 2) {
                        this.gatlingShots--;
                        const angle = this.gatlingTargetAngle + (Math.random() - 0.5) * 0.3;
                        gameObjects.push(new Projectile(this, angle, 'text-yellow-500 font-bold', '🔸', 15, this.atk * 0.9, true));
                    }

                    if (activeSkill === 'slow_zone' && this.checkCooldown('slow', 3000)) zones.push(new Zone(this.x, this.y, 60, 'bg-blue-500 opacity-30', 'slow', this.teamId, 5000));
                    if (activeSkill === 'poison_zone' && this.checkCooldown('poison', 4000)) zones.push(new Zone(this.x, this.y, 60, 'bg-purple-600 opacity-40', 'poison', this.teamId, 5000, this.atk * 0.1));
                    if (activeSkill === 'pitfall' && this.checkCooldown('pitfall', 5000)) {
                        zones.push(new Zone(this.x, this.y, 30, 'bg-black opacity-80', 'pitfall', this.teamId, 10000, this.atk, this));
                    }
                    
                    if (activeSkill === 'wall_create' && this.checkCooldown('wall', 15000)) {
                        const aliveTeamsForWall = new Set(characters.filter(c => c.isAlive && (!c.isMinion || c.isFragment)).map(c => c.teamId)).size;
                        if (aliveTeamsForWall > 2) {
                            for(let i=0; i<8; i++) {
                                const a = (Math.PI / 4) * i;
                                zones.push(new WallZone(this.x + Math.cos(a)*40, this.y + Math.sin(a)*40, 20, this.teamId, 4000));
                            }
                        } else {
                            showFloatingText(this.x, this.y, 'No Wall', 'text-stone-400');
                        }
                    }

                    if (activeSkill === 'teleport' && this.checkCooldown('tp', 6000)) {
                        createEffect('effect-text text-indigo-400', this.x, this.y, '💨', 300);
                        const angle = Math.random() * Math.PI * 2; const r = Math.random() * (currentBattlefieldRadius - this.radius);
                        this.x = BATTLEFIELD_SIZE/2 + Math.cos(angle) * r; this.y = BATTLEFIELD_SIZE/2 + Math.sin(angle) * r;
                        this.teleportInvincibleEndTime = gameTime + 2000;
                        createEffect('effect-text text-indigo-400', this.x, this.y, '💨', 300);
                    }

                    if (activeSkill === 'underground' && this.checkCooldown('under', 7000)) {
                        this.isUnderground = true;
                        createEffect('effect-text text-amber-900', this.x, this.y, '🕳️', 500);
                        scheduleTimeout(() => {
                            if(!this.isAlive) return;
                            this.isUnderground = false;
                            this.checkWallCollision();
                            this.updatePosition();
                            createEffect('effect-text text-amber-900', this.x, this.y, '💥', 500, 'font-size:40px;');
                            characters.forEach(c => { if(c.isAlive && c.teamId !== this.teamId && getDistance(this, c)<80) c.takeDamage(this.atk*2, false, this); });
                        }, 4000, this);
                    }

                    if (activeSkill === 'random_lightning' && this.checkCooldown('lightning', 2000)) {
                        const target = this.getNearestEnemy();
                        if (target && target.skill !== 'nullify') {
                            createEffect('effect-text text-yellow-300', target.x, target.y - 20, '⚡', 500, 'font-size: 40px;');
                            target.takeDamage(this.atk * 4.5, false, this);
                            this.triggerWeaponHeal();
                        }
                    }

                    if (activeSkill === 'flamethrower' && this.checkCooldown('flame', 3000)) {
                        const angle = Math.atan2(this.vy, this.vx);
                        createEffect('effect-text text-red-500', this.x + Math.cos(angle)*80, this.y + Math.sin(angle)*80, '🔥', 600, 'font-size:100px;');
                        characters.forEach(c => {
                            if (c.isAlive && c.teamId !== this.teamId && c.skill !== 'nullify' && getDistance(this, c) < 250) {
                                let diff = Math.abs(Math.atan2(c.y - this.y, c.x - this.x) - angle);
                                if (diff > Math.PI) diff = Math.PI * 2 - diff;
                                if (diff < Math.PI / 4) {
                                    c.takeDamage(this.atk * 6.0, false, this);
                                    this.triggerWeaponHeal();
                                }
                            }
                        });
                    }
                    
                    if (activeSkill === 'acid_spray' && this.checkCooldown('acid', 3500)) {
                        const angle = Math.atan2(this.vy, this.vx);
                        createEffect('effect-text text-green-500', this.x + Math.cos(angle)*60, this.y + Math.sin(angle)*60, '💦', 600, 'font-size:80px;');
                        characters.forEach(c => {
                            if (c.isAlive && c.teamId !== this.teamId && c.skill !== 'nullify' && getDistance(this, c) < 200) {
                                let diff = Math.abs(Math.atan2(c.y - this.y, c.x - this.x) - angle);
                                if (diff > Math.PI) diff = Math.PI * 2 - diff;
                                if (diff < Math.PI / 4) { 
                                    c.takeDamage(this.atk * 3.0, false, this); c.speed *= 0.8; 
                                    this.triggerWeaponHeal();
                                }
                            }
                        });
                    }

                    if (activeSkill === 'clone' && this.checkCooldown('clone', 10000)) {
                        const clone = new Character(this.name + ' (分身)', null, true, this.teamId);
                        clone.x = this.x + 20; clone.y = this.y + 20;
                        clone.avatar = this.avatar; clone.maxHp = this.maxHp * 0.2; clone.hp = clone.maxHp; clone.atk = this.atk * 0.5; clone.speed = this.speed;
                        characters.push(clone); clone.createDOM();
                    }
                    
                    if (activeSkill === 'summon_pet' && this.checkCooldown('pet', 8000)) {
                        const pet = new Character(this.name + 'のペット', mulberry32(gameTime), true, this.teamId);
                        pet.x = this.x - 20; pet.y = this.y - 20; pet.speed = this.speed * 1.2;
                        characters.push(pet); pet.createDOM();
                    }

                    if (activeSkill === 'summon_knight' && !this.hasSummonedKnight && this.checkCooldown('knight', 12000)) {
                        this.hasSummonedKnight = true;
                        const knight = new Character('騎士', null, true, this.teamId);
                        knight.avatar = '🛡️'; 
                        knight.maxHp = this.maxHp * 0.5; knight.hp = knight.maxHp; 
                        knight.atk = this.atk * 1.5; knight.speed = this.speed; knight.radius = 20;
                        knight.x = this.x + 30; knight.y = this.y + 30;
                        characters.push(knight); knight.createDOM();
                        this.knightRef = knight;
                    }

                    if (activeSkill === 'rainbow_beam' && this.checkCooldown('beam', 6000)) {
                        const repeat = isWizardMagic ? 1 : 3;
                        let rCount = 0;
                        const rInt = scheduleInterval(() => {
                            if (!this.isAlive || rCount++ >= repeat || !isPlaying) return simulationTimers.delete(rInt);
                            const angle = Math.atan2(this.vy, this.vx);
                            createEffect('beam-effect', this.x, this.y, '', 600, `width:1000px; height:40px; background:linear-gradient(to right, red, orange, yellow, green, blue, indigo, violet); transform: translateY(-50%) rotate(${angle * 180 / Math.PI}deg);`);
                            characters.forEach(c => {
                                if (c.isAlive && c.teamId !== this.teamId && c.skill !== 'nullify') {
                                    let diff = Math.abs(Math.atan2(c.y - this.y, c.x - this.x) - angle);
                                    if (diff > Math.PI) diff = Math.PI * 2 - diff;
                                    if (diff < 0.1) {
                                        c.takeDamage(this.atk * 9.0, true, this);
                                        this.triggerWeaponHeal();
                                    }
                                }
                            });
                        }, 300, this);
                    }
                    
                    if (activeSkill === 'homing_laser' && this.checkCooldown('homing', 2500)) {
                        const target = this.getNearestEnemy();
                        if (target) {
                            gameObjects.push(new HomingProjectile(this, target, 'text-cyan-400 font-bold', '☄️', 12, this.atk * 3.6, true));
                        }
                    }

                    if (activeSkill === 'sonic_wave' && this.checkCooldown('sonic', 3500)) {
                        this.stunEndTime = gameTime + 1000;
                        this.sonicInvincibleEndTime = gameTime + 1000;
                        let count = 0;
                        const interval = scheduleInterval(() => {
                            if (!this.isAlive || count >= 5 || !isPlaying) return simulationTimers.delete(interval);
                            createEffect('zone border-4 border-teal-300', this.x, this.y, '', 400, 'width: 300px; height: 300px; transition: width 0.4s, height 0.4s;');
                            characters.forEach(c => {
                                if (c.isAlive && c.teamId !== this.teamId && getDistance(this, c) < 150) {
                                    if(c.skill !== 'nullify') {
                                        c.takeDamage(this.atk * 3.0, false, this);
                                        c.vx += (c.x - this.x) * 0.2; c.vy += (c.y - this.y) * 0.2; 
                                    }
                                }
                            });
                            count++;
                        }, 200, this);
                    }
                    
                    if (activeSkill === 'water_push' && this.checkCooldown('water', 4000)) {
                        createEffect('zone bg-blue-300 opacity-50', this.x, this.y, '', 300, 'width: 350px; height: 350px; transition: width 0.3s, height 0.3s;');
                        characters.forEach(c => {
                            if (c.isAlive && c.teamId !== this.teamId && c.skill !== 'nullify' && getDistance(this, c) < 175) {
                                c.takeDamage(this.atk * 1.5, false, this);
                                c.vx += (c.x - this.x) * 0.5; c.vy += (c.y - this.y) * 0.5; 
                            }
                        });
                    }

                    if (activeSkill === 'slash' && this.checkCooldown('slash', 2000)) {
                        const target = this.getNearestEnemy();
                        if (target && target.skill !== 'nullify' && getDistance(this, target) < 120) {
                            createEffect('slash-effect text-white', (this.x + target.x)/2, (this.y + target.y)/2, '⚔️', 200, 'font-size: 50px;');
                            target.takeDamage(this.atk * 7.5, true, this);
                            this.triggerWeaponHeal();
                        }
                    }
                    
                    if (activeSkill === 'giant_punch' && this.checkCooldown('punch', 4000)) {
                        const target = this.getNearestEnemy();
                        if (target && target.skill !== 'nullify' && getDistance(this, target) < 100) {
                            createEffect('slash-effect text-orange-500', target.x, target.y, '🥊', 300, 'font-size:80px;');
                            target.takeDamage(this.atk * 12.0, true, this);
                            target.vx += (target.x - this.x) * 0.8; target.vy += (target.y - this.y) * 0.8;
                            this.triggerWeaponHeal();
                        }
                    }

                    if (activeSkill === 'tornado' && this.checkCooldown('tornado', 4500)) {
                        const life = isWizardMagic ? 150 : 400; 
                        gameObjects.push(new Tornado(this.x, this.y, this.teamId, this.atk * 1.5, life));
                    }
                    
                    if (activeSkill === 'bomb_throw' && this.checkCooldown('bomb', 3500)) {
                        const target = this.getNearestEnemy();
                        if(target) gameObjects.push(new Bomb(target.x, target.y, this.teamId, this.atk * 9.0));
                    }
                    
                    if (activeSkill === 'knife_throw' && this.checkCooldown('knife', 3500)) {
                        for(let i=0; i<12; i++) {
                            const angle = (Math.PI / 6) * i;
                            gameObjects.push(new Projectile(this, angle, 'text-gray-300 font-bold', '🗡️', 14, this.atk * 3.0, true)); 
                        }
                    }

                    if (activeSkill === 'freeze_aura' && this.checkCooldown('freeze', 7000)) {
                        const repeat = isWizardMagic ? 1 : 3;
                        let rCount = 0;
                        const rInt = scheduleInterval(() => {
                            if (!this.isAlive || rCount++ >= repeat || !isPlaying) return simulationTimers.delete(rInt);
                            createEffect('zone bg-cyan-200 opacity-50', this.x, this.y, '', 300, 'width: 240px; height: 240px;');
                            characters.forEach(c => {
                                if (c.isAlive && c.teamId !== this.teamId && c.skill !== 'nullify' && getDistance(this, c) < 120) { 
                                    c.stunEndTime = gameTime + 2500; 
                                    showFloatingText(c.x, c.y, 'FREEZE!', 'text-cyan-300'); 
                                    this.triggerWeaponHeal();
                                }
                            });
                        }, 400, this);
                    }
                    
                    if (activeSkill === 'chain_bind' && this.checkCooldown('chain', 8000)) {
                        const target = this.getNearestEnemy();
                        if (target && target.skill !== 'nullify' && getDistance(this, target) < 150) {
                            target.stunEndTime = gameTime + 3000;
                            target.chainBindEndTime = gameTime + 3000;
                            createEffect('beam-effect', this.x, this.y, '', 3000, `width:${getDistance(this, target)}px; height:5px; background:gray; transform: translateY(-50%) rotate(${Math.atan2(target.y-this.y, target.x-this.x)*180/Math.PI}deg);`);
                            showFloatingText(target.x, target.y, 'BIND!', 'text-stone-400');
                        }
                    }

                    if (activeSkill === 'time_stop' && this.checkCooldown('timestop', 15000)) {
                        timeStopState = { active: true, ownerTeam: this.teamId, endTime: gameTime + 3000 };
                        ui.timeStopOverlay.classList.remove('hidden');

                    }
                    
                    if (activeSkill === 'time_slow' && this.checkCooldown('timeslow', 12000)) {
                        timeSlowState = { active: true, ownerTeam: this.teamId, endTime: gameTime + 4000 };
                        createEffect('effect-text text-indigo-300', BATTLEFIELD_SIZE/2, BATTLEFIELD_SIZE/2, 'SLOW DOWN', 1000, 'font-size: 60px;');
                    }

                    if (activeSkill === 'expand_domain' && !this.usedExpandDomain && currentBattlefieldRadius < BATTLEFIELD_SIZE/3) {
                        this.usedExpandDomain = true;
                        currentBattlefieldRadius = BATTLEFIELD_SIZE / 2;
                        this.heal(this.maxHp);
                        createEffect('effect-text text-emerald-300', BATTLEFIELD_SIZE/2, BATTLEFIELD_SIZE/2, 'DOMAIN EXPANSION', 2000, 'font-size: 60px;');
                    }

                    if (activeSkill === 'jet_dash' && this.checkCooldown('jet', 5000)) {
                        const angle = Math.atan2(this.vy, this.vx);
                        this.vx = Math.cos(angle) * this.speed * 8; 
                        this.vy = Math.sin(angle) * this.speed * 8;
                        createEffect('effect-text text-red-400', this.x, this.y, '💨', 500);
                    }
                    
                    if (activeSkill === 'flying' && this.checkCooldown('fly_active', 8000)) {
                        this.flightEndTime = gameTime + 4000;
                        createEffect('effect-text text-sky-300', this.x, this.y, '🦅', 500);
                        this.updateUI();
                    }

                    if (activeSkill === 'warp_gate' && this.checkCooldown('warp_gate', 15000)) {
                        const r = currentBattlefieldRadius - 30;
                        const a1 = Math.random()*Math.PI*2; const a2 = Math.random()*Math.PI*2;
                        const p1 = {x: BATTLEFIELD_SIZE/2 + Math.cos(a1)*r, y: BATTLEFIELD_SIZE/2 + Math.sin(a1)*r};
                        const p2 = {x: BATTLEFIELD_SIZE/2 + Math.cos(a2)*r, y: BATTLEFIELD_SIZE/2 + Math.sin(a2)*r};
                        gameObjects.push(new WarpGate(p1.x, p1.y, p2.x, p2.y, 10000, this.teamId));
                    }
                    
                    if (activeSkill === 'team_haste' && this.checkCooldown('haste', 10000)) {
                        characters.forEach(c => {
                            if(c.isAlive && c.teamId === this.teamId) {
                                c.hasteEndTime = gameTime + 5000;
                                showFloatingText(c.x, c.y, 'SPEED UP!', 'text-cyan-200');
                            }
                        });
                    }
                    
                    if (activeSkill === 'wizard_mode' && this.checkCooldown('wizard', 15000)) {
                        this.wizardEndTime = gameTime + 5000;
                        createEffect('effect-text text-violet-500', this.x, this.y, '🪄 WIZARD MODE!', 1000);
                    }

                    if (activeSkill === 'magnet_repel' && this.checkCooldown('magnet', 4000)) {
                        createEffect('zone border-4 border-pink-300 opacity-50', this.x, this.y, '', 300, 'width: 250px; height: 250px;');
                        characters.forEach(c => {
                            if (c.isAlive && c.teamId !== this.teamId && getDistance(this, c) < 125) {
                                const d = getDistance(this, c);
                                if(d > 0) { 
                                    c.vx += (c.x - this.x)/d * 8; 
                                    c.vy += (c.y - this.y)/d * 8; 
                                }
                            }
                        });
                        showFloatingText(this.x, this.y, 'REPEL!', 'text-pink-300');
                    }
                }

                this.normalizeSpeed();
                this.x += this.vx;
                this.y += this.vy;
                this.checkWallCollision();
                this.updatePosition();
            }

            checkWallCollision() {
                if (this.isUnderground) return;

                const cx = BATTLEFIELD_SIZE / 2; const cy = BATTLEFIELD_SIZE / 2;
                const dx = this.x - cx; const dy = this.y - cy;
                const distFromCenter = Math.sqrt(dx * dx + dy * dy);
                const r = currentBattlefieldRadius - this.radius;

                if (distFromCenter > r && r > 0) {
                    const nx = dx / distFromCenter; const ny = dy / distFromCenter;
                    this.x = cx + nx * r; this.y = cy + ny * r;

                    const dot = this.vx * nx + this.vy * ny;
                    if (dot > 0) { 
                        this.vx -= 2 * dot * nx; this.vy -= 2 * dot * ny;
                        
                        if (this.skill === 'accelerate_on_bounce') { 
                            this.speed += 0.5; 
                            this.heal(10);
                        }
                        this.normalizeSpeed();
                        
                        if (globalSpikesActive && this.teamId !== characters.find(c=>c.skill==='border_spikes')?.teamId) {
                            if (gameTime - (this.lastSpikeDamageTime || 0) > 500) {
                                this.takeDamage(10, false, null);
                                this.lastSpikeDamageTime = gameTime;
                                
                                const spikeOwner = characters.find(c => c.skill === 'border_spikes' && c.isAlive);
                                if (spikeOwner) {
                                    spikeOwner.heal(2);
                                }
                            }
                        }
                    }
                }
            }

            attack(target) {
                let damage = this.atk * (0.8 + Math.random() * 0.4);
                let isCrit = false;
                
                if (this.skill === 'summon_knight' && this.knightRef && this.knightRef.isAlive) {
                    damage = 1 * (0.8 + Math.random() * 0.4);
                }
                
                if (timeStopState.active && timeStopState.ownerTeam === this.teamId) {
                    damage *= 150.0;
                }

                if (this.skill === 'nullify' && target.isInvincibleState()) {
                    damage = 999999;
                    createEffect('effect-text text-gray-500', target.x, target.y, 'NULLIFIED!', 1000);
                }

                if (this.skill === 'critical' && Math.random() < 0.10) { damage *= 20; isCrit = true; }
                
                if (this.skill === 'instant_kill' && Math.random() < 0.01) {
                    damage = 99999; createEffect('effect-text text-red-900', target.x, target.y, 'DEATH!', 1000);
                }

                let isVampireHit = this.skill === 'vampire' || this.vampireActive;

                target.takeDamage(damage, isCrit, this, this.skill === 'nullify');
                
                if (this.skill === 'seven_attacks') {
                    for (let i = 1; i < 7; i++) {
                        scheduleTimeout(() => { if(target.isAlive && this.isAlive) target.takeDamage(damage*0.8, false, this, this.skill === 'nullify'); }, 100 * i, this);
                    }
                    this.sevenAttackCount++;
                    if (this.sevenAttackCount >= 7) {
                        this.sevenAttackCount = 0;
                        this.heal(77);
                    }
                }

                if (isVampireHit && target.hp > 0) this.heal(damage * 0.5);
                
                if (this.skill === 'scaling_spd') {
                    const mySpd = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
                    const tgSpd = Math.sqrt(target.vx*target.vx + target.vy*target.vy);
                    if (mySpd > tgSpd) {
                        this.heal(this.maxHp * 0.02);
                    }
                }

                if (this.skill === 'super_knockback') {
                    const nx = target.x - this.x; const ny = target.y - this.y;
                    const dist = Math.max(1, Math.sqrt(nx*nx + ny*ny));
                    target.vx = (nx/dist) * 20; target.vy = (ny/dist) * 20;
                }
            }
        }

        class Projectile {
            constructor(owner, angle, colorClass, icon, speed, damage, healOwner = false) {
                this.owner = owner; this.x = owner.x; this.y = owner.y;
                this.vx = Math.cos(angle) * speed; this.vy = Math.sin(angle) * speed;
                this.damage = damage; this.isAlive = true;
                this.healOwner = healOwner;
                
                this.el = document.createElement('div');
                this.el.className = `projectile ${colorClass} text-lg`;
                this.el.textContent = icon;
                ui.battlefield.appendChild(this.el);
            }
            update() {
                if(!this.isAlive) return;
                this.x += this.vx; this.y += this.vy;
                this.el.style.left = `${this.x}px`; this.el.style.top = `${this.y}px`;
                
                const dx = this.x - BATTLEFIELD_SIZE/2; const dy = this.y - BATTLEFIELD_SIZE/2;
                if(Math.sqrt(dx*dx + dy*dy) > currentBattlefieldRadius) { this.die(); return; }

                for (let c of characters) {
                    if (c.isAlive && c.teamId !== this.owner.teamId && !c.isUnderground && c.skill !== 'nullify') {
                        if (getDistance(this, c) < c.radius + 8) {
                            c.takeDamage(this.damage, false, this.owner);
                            if (this.healOwner && this.owner.isAlive) {
                                this.owner.triggerWeaponHeal();
                            }
                            this.die(); return;
                        }
                    }
                }
            }
            die() { this.isAlive = false; this.el.remove(); }
        }

        class HomingProjectile extends Projectile {
            constructor(owner, target, colorClass, icon, speed, damage, healOwner = false) {
                const initAngle = Math.atan2(target.y - owner.y, target.x - owner.x);
                super(owner, initAngle, colorClass, icon, speed, damage, healOwner);
                this.target = target;
                this.baseSpeed = speed;
            }
            update() {
                if(!this.isAlive) return;
                if(this.target && this.target.isAlive) {
                    const currentAngle = Math.atan2(this.vy, this.vx);
                    const targetAngle = Math.atan2(this.target.y - this.y, this.target.x - this.x);
                    
                    let diff = targetAngle - currentAngle;
                    while (diff > Math.PI) diff -= Math.PI * 2;
                    while (diff < -Math.PI) diff += Math.PI * 2;
                    
                    const turnSpeed = 0.15;
                    const turn = Math.max(-turnSpeed, Math.min(turnSpeed, diff));
                    
                    const newAngle = currentAngle + turn;
                    this.vx = Math.cos(newAngle) * this.baseSpeed;
                    this.vy = Math.sin(newAngle) * this.baseSpeed;
                }
                super.update();
            }
        }

        class Bomb {
            constructor(x, y, teamId, damage) {
                this.x = x; this.y = y; this.teamId = teamId; this.damage = damage;
                this.endTime = gameTime + 2000;
                this.el = document.createElement('div');
                this.el.className = `projectile text-red-500 text-2xl`;
                this.el.textContent = '💣';
                this.el.style.left = `${x}px`; this.el.style.top = `${y}px`;
                ui.battlefield.appendChild(this.el);
            }
            update() {
                if(gameTime > this.endTime) {
                    createEffect('effect-text text-red-500', this.x, this.y, '💥', 500, 'font-size:100px;');
                    characters.forEach(c => {
                        if(c.isAlive && c.teamId !== this.teamId && c.skill !== 'nullify' && getDistance(this, c) < 150) {
                            c.takeDamage(this.damage, false, null);
                            const owner = characters.find(ch => ch.id === this.teamId);
                            if(owner && owner.isAlive) owner.triggerWeaponHeal();
                        }
                    });
                    this.el.remove(); return false;
                }
                this.el.style.opacity = (Math.floor(gameTime / 200) % 2 === 0) ? '1' : '0.5';
                return true;
            }
        }

        class Tornado {
            constructor(x, y, teamId, damage, life = 300) {
                this.x = x; this.y = y; this.teamId = teamId; this.damage = damage;
                this.vx = (Math.random() - 0.5) * 4; this.vy = (Math.random() - 0.5) * 4;
                this.life = life; 
                this.el = document.createElement('div');
                this.el.className = `tornado-effect text-gray-400 opacity-70`;
                this.el.textContent = '🌪️';
                ui.battlefield.appendChild(this.el);
            }
            update() {
                if(this.life-- <= 0) { this.el.remove(); return false; }
                this.vx += (Math.random() - 0.5); this.vy += (Math.random() - 0.5);
                const speed = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
                if(speed > 3) { this.vx = (this.vx/speed)*3; this.vy = (this.vy/speed)*3; }
                
                this.x += this.vx; this.y += this.vy;
                this.el.style.left = `${this.x}px`; this.el.style.top = `${this.y}px`;

                if (gameTime % 200 < TICK_RATE) {
                    characters.forEach(c => {
                        if(c.isAlive && c.teamId !== this.teamId && !c.isFlying && !c.isUnderground && c.skill !== 'nullify') {
                            const d = getDistance(this, c);
                            if(d < 200) {
                                c.x += (this.x - c.x) * 0.05; c.y += (this.y - c.y) * 0.05;
                                if(d < 80) {
                                    c.takeDamage(this.damage, false, null);
                                    const owner = characters.find(ch => ch.id === this.teamId);
                                    if(owner && owner.isAlive) owner.triggerWeaponHeal();
                                }
                            }
                        }
                    });
                }
                return true;
            }
        }

        class Zone {
            constructor(x, y, radius, colorClasses, type, teamId, duration, value=0, owner=null) {
                this.x = x; this.y = y; this.radius = radius; this.type = type; this.teamId = teamId;
                this.endTime = gameTime + duration; this.value = value; this.owner = owner;
                this.el = document.createElement('div');
                this.el.className = `zone ${colorClasses}`;
                this.el.style.width = `${radius*2}px`; this.el.style.height = `${radius*2}px`;
                this.el.style.left = `${x}px`; this.el.style.top = `${y}px`;
                ui.battlefield.appendChild(this.el);
            }
            update() {
                if(gameTime > this.endTime) { this.el.remove(); return false; }
                if (gameTime % 200 < TICK_RATE) {
                    characters.forEach(c => {
                        if(c.isAlive && c.teamId !== this.teamId && !c.isFlying && !c.isUnderground && c.skill !== 'nullify') {
                            if(getDistance(this, c) < this.radius + c.radius) {
                                if (this.type === 'slow') { c.vx *= 0.5; c.vy *= 0.5; } 
                                else if (this.type === 'poison') { c.takeDamage(this.value, false, null); } 
                                else if (this.type === 'pitfall') {
                                    c.stunEndTime = gameTime + 2000; c.takeDamage(this.value, false, null); this.endTime = 0;
                                    if (this.owner && this.owner.isAlive) {
                                        this.owner.heal(this.owner.maxHp * 0.05);
                                    }
                                }
                            }
                        }
                    });
                }
                return true;
            }
        }

        class WallZone extends Zone {
            constructor(x, y, radius, teamId, duration) {
                super(x, y, radius, 'bg-stone-600 opacity-80 border-2 border-stone-400', 'wall', teamId, duration);
            }
            update() {
                if(gameTime > this.endTime) { this.el.remove(); return false; }
                characters.forEach(c => {
                    if(c.isAlive && !c.isUnderground && c.skill !== 'nullify') {
                        const d = getDistance(this, c);
                        const minDist = this.radius + c.radius;
                        if(d < minDist) {
                            const overlap = minDist - d;
                            const nx = d > 0 ? (c.x - this.x) / d : 1; const ny = d > 0 ? (c.y - this.y) / d : 0;
                            c.x += nx * overlap; c.y += ny * overlap;
                        }
                    }
                });
                return true;
            }
        }

        class WarpGate {
            constructor(x1, y1, x2, y2, duration, ownerTeam) {
                this.p1 = {x: x1, y: y1}; this.p2 = {x: x2, y: y2};
                this.endTime = gameTime + duration;
                this.ownerTeam = ownerTeam;
                this.el1 = createEffect('zone bg-fuchsia-500 opacity-50 animate-pulse', x1, y1, '🌀', 0, 'width:40px;height:40px;');
                this.el2 = createEffect('zone bg-fuchsia-500 opacity-50 animate-pulse', x2, y2, '🌀', 0, 'width:40px;height:40px;');
                this.cooldowns = new Map();
            }
            update() {
                if(gameTime > this.endTime) { this.el1.remove(); this.el2.remove(); return false; }
                characters.forEach(c => {
                    if(c.isAlive && !c.isUnderground && c.skill !== 'nullify') {
                        if((this.cooldowns.get(c.id)||0) > gameTime) return;
                        if(getDistance(c, this.p1) < 20) {
                            c.x = this.p2.x; c.y = this.p2.y; this.cooldowns.set(c.id, gameTime + 2000);
                            if (c.teamId !== this.ownerTeam) c.weakEndTime = gameTime + 3000;
                            createEffect('effect-text text-fuchsia-300', c.x, c.y, 'WARP', 500);
                        } else if(getDistance(c, this.p2) < 20) {
                            c.x = this.p1.x; c.y = this.p1.y; this.cooldowns.set(c.id, gameTime + 2000);
                            if (c.teamId !== this.ownerTeam) c.weakEndTime = gameTime + 3000;
                            createEffect('effect-text text-fuchsia-300', c.x, c.y, 'WARP', 500);
                        }
                    }
                });
                return true;
            }
        }

        function prepareGame() {
            const inputText = ui.nameInput.value.trim();
            if (!inputText) return false;

            const names = parseNames(inputText);
            if (names.length > MAX_PLAYERS) return false;
            
            if (names.length < 2) return false;
            clearTimeout(debounceTimer);
            clearTimeout(resultTimer);
            simulationTimers.clear();
            lastSortTime = 0;

            ui.battlefield.innerHTML = `
                <div id="battlefield-floor"></div>
                <div id="battlefield-bg">
                    <div id="danger-zone"></div>
                </div>
            `;
            ui.battlefieldBg = document.getElementById('battlefield-bg');
            ui.characterList.innerHTML = '';
            
            characters = [];
            gameObjects = []; 
            zones = [];
            charIdCounter = 0;

            const globalSeed = cyrb53(JSON.stringify([...names].sort()));
            let skillPool = [...SKILLS.filter(s => s.id !== 'none')];
            
            names.forEach((name) => {
                const seedHash = cyrb53(name, globalSeed);
                const rand = mulberry32(seedHash);
                
                if (skillPool.length === 0) skillPool = [...SKILLS.filter(s => s.id !== 'none')];
                
                const nameHash = cyrb53(name);
                const poolIndex = nameHash % skillPool.length;
                const assignedSkillId = skillPool[poolIndex].id;
                skillPool.splice(poolIndex, 1);
                
                const char = new Character(name, rand, false, null, assignedSkillId);
                characters.push(char);
                char.createDOM();
                char.createListItem();
            });

            initialTeamCount = names.length;
            updateAliveCount();
            return true;
        }

        ui.startBtn.addEventListener('click', () => {
            try {
                if (!prepareGame()) {
                    alert('戦闘には少なくとも2人の名前が必要です。');
                    return;
                }

                timeStopState = { active: false, ownerTeam: null, endTime: 0 };
                timeSlowState = { active: false, ownerTeam: null, endTime: 0 };
                globalSpikesActive = false;
                isSuddenDeath = false;
                hasFirstDeathOccurred = false;
                ui.timeStopOverlay.classList.add('hidden');

                gameTime = 0;
                updateGameTimeDisplay();
                saveSettings();
                currentBattlefieldRadius = BATTLEFIELD_SIZE / 2;
                ui.battlefieldBg.style.width = `${BATTLEFIELD_SIZE}px`;
                ui.battlefieldBg.style.height = `${BATTLEFIELD_SIZE}px`;
                
                ui.battlefield.classList.remove('hidden');
                ui.startOverlay.classList.add('hidden');
                ui.gameOverOverlay.classList.add('hidden');
                ui.editorPanel.classList.add('hidden');
                ui.pauseBtn.disabled = false;
                ui.pauseBtn.textContent = '一時停止';
                ui.pauseBtn.className = 'px-4 py-2 bg-yellow-600 hover:bg-yellow-500 text-white font-bold rounded shadow';
                ui.stopBtn.classList.remove('hidden');
                ui.shuffleBtn.disabled = true; 
                isPlaying = true;

                startLoop();
                resizeBattlefield();
            } catch (e) {
                console.error("Game Start Error:", e);
                alert("開始に失敗しました。");
            }
        });

        let debounceTimer;
        ui.nameInput.addEventListener('input', () => {
            updateInputStatus();
            saveSettings();
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => {
                if (!ui.startOverlay.classList.contains('hidden')) prepareGame();
            }, 300);
        });

        function gameLoop() {
            if (!isPlaying) return;

            gameTime += TICK_RATE;
            runSimulationTimers();
            updateGameTimeDisplay();
            globalSpikesActive = false; 

            if (gameTime >= 50000 && !isSuddenDeath) {
                isSuddenDeath = true;
                createEffect('effect-text text-red-500 font-black', BATTLEFIELD_SIZE/2, BATTLEFIELD_SIZE/2, '💀 サドンデス突入！ 💀<br><span class="text-2xl">攻撃力10倍 / 速度3倍</span>', 3000, 'font-size: 60px; text-align: center; line-height: 1.2; width: 800px;');
                characters.forEach(c => {
                    if (c.isAlive && !c.isMinion) {
                        c.atk *= 10;
                        c.speed *= 3;
                        c.normalizeSpeed();
                    }
                });
            }

            characters.forEach(c => {
                if (c.isAlive && c.skill === 'vampire_lord' && gameTime >= 50000) {
                    c.takeDamage(999999, true, null, true);
                }
            });

            if (timeStopState.active && gameTime > timeStopState.endTime) {
                timeStopState.active = false; ui.timeStopOverlay.classList.add('hidden');
            }
            if (timeSlowState.active && gameTime > timeSlowState.endTime) {
                timeSlowState.active = false;
            }

            const aliveTeams = new Set(characters.filter(c => c.isAlive && (!c.isMinion || c.isFragment)).map(c => c.teamId));

            const playerBasedRadius = (BATTLEFIELD_SIZE / 2) * Math.sqrt(Math.max(1, aliveTeams.size) / initialTeamCount);
            const timeBasedRadius = (BATTLEFIELD_SIZE / 2) * (1 - Math.min(1, gameTime / 50000)) + (MIN_BATTLEFIELD_SIZE / 2);
            const targetRadius = Math.max(MIN_BATTLEFIELD_SIZE / 2, Math.min(playerBasedRadius, timeBasedRadius));

            if (currentBattlefieldRadius > targetRadius) {
                currentBattlefieldRadius -= (20 / FPS); 
                if (currentBattlefieldRadius < targetRadius) currentBattlefieldRadius = targetRadius;
                const diameter = currentBattlefieldRadius * 2;
                ui.battlefieldBg.style.width = `${diameter}px`;
                ui.battlefieldBg.style.height = `${diameter}px`;
            }

            if (!timeStopState.active) {
                gameObjects = gameObjects.filter(g => {
                    if (g.update) {
                        const res = g.update();
                        if (res === false) return false;
                    }
                    return g.isAlive !== false;
                });
                zones = zones.filter(z => z.update());
            } else {
                gameObjects = gameObjects.filter(g => {
                    if(g.owner && g.owner.teamId === timeStopState.ownerTeam && g.update) {
                        const res = g.update();
                        if (res === false) return false;
                    }
                    return g.isAlive !== false;
                });
            }

            for (let i = 0; i < characters.length; i++) characters[i].act();

            for (let i = 0; i < characters.length; i++) {
                for (let j = i + 1; j < characters.length; j++) {
                    const c1 = characters[i]; const c2 = characters[j];
                    if (!c1.isAlive || !c2.isAlive) continue;
                    if (c1.isUnderground || c2.isUnderground) continue; 
                    if (c1.flightEndTime > gameTime || c2.flightEndTime > gameTime) continue;

                    const dx = c2.x - c1.x; const dy = c2.y - c1.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    const minDist = c1.radius + c2.radius;

                    if (dist < minDist) {
                        const overlap = minDist - dist;
                        const nx = dist > 0 ? dx / dist : 1; const ny = dist > 0 ? dy / dist : 0;
                        c1.x -= nx * overlap / 2; c1.y -= ny * overlap / 2;
                        c2.x += nx * overlap / 2; c2.y += ny * overlap / 2;

                        const dvx = c1.vx - c2.vx; const dvy = c1.vy - c2.vy;
                        const dotProduct = dvx * nx + dvy * ny;

                        if (dotProduct > 0) {
                            c1.vx -= dotProduct * nx; c1.vy -= dotProduct * ny;
                            c2.vx += dotProduct * nx; c2.vy += dotProduct * ny;

                            if (c1.teamId !== c2.teamId) {
                                const c1CanAct = !timeStopState.active || timeStopState.ownerTeam === c1.teamId;
                                const c2CanAct = !timeStopState.active || timeStopState.ownerTeam === c2.teamId;
                                if (c1CanAct && c1.stunEndTime <= gameTime) c1.attack(c2);
                                if (c2CanAct && c2.stunEndTime <= gameTime) c2.attack(c1);
                            }
                        }
                    }
                }
            }
            
            for (let i = 0; i < characters.length; i++) {
                characters[i].checkWallCollision();
                characters[i].updatePosition();
            }
            
            updateListOrder();
            checkWinCondition();
        }

        function updateGameTimeDisplay() {
            const seconds = Math.floor(gameTime / 1000);
            const m = String(Math.floor(seconds / 60)).padStart(2, '0');
            const s = String(seconds % 60).padStart(2, '0');
            ui.gameTime.textContent = `${m}:${s}`;
            if (isSuddenDeath) ui.gameTime.classList.add('text-red-500', 'font-bold');
            else ui.gameTime.classList.remove('text-red-500', 'font-bold');
        }

        function updateAliveCount() {
            const aliveTeams = new Set(characters.filter(c => c.isAlive && (!c.isMinion || c.isFragment)).map(c => c.teamId));
            ui.aliveCount.textContent = `${aliveTeams.size} / ${initialTeamCount} チーム生存`;
        }

        function checkWinCondition() {
            updateAliveCount();
            
            const aliveTeams = Array.from(new Set(characters.filter(c => c.isAlive && (!c.isMinion || c.isFragment)).map(c => c.teamId)));
            
            if (aliveTeams.length <= 1) {
                if (aliveTeams.length === 1) {
                    const winnerId = aliveTeams[0];
                    let winner = characters.find(c => c.id === winnerId && c.isAlive);
                    if (!winner) winner = characters.find(c => c.teamId === winnerId && !c.isMinion && c.isAlive);
                    if (!winner) winner = characters.find(c => c.teamId === winnerId && c.isAlive);
                    if (!winner) winner = characters.find(c => c.id === winnerId);
                    finishGame(winner);
                } else {
                    finishGame(null);
                }
            }
        }

        function finishGame(winner) {
            isPlaying = false;
            stopLoop();
            simulationTimers.clear();
            ui.pauseBtn.disabled = true;
            ui.editorPanel.classList.add('hidden');
            ui.stopBtn.classList.add('hidden'); 
            
            clearTimeout(resultTimer);
            resultTimer = setTimeout(() => {
                ui.gameOverOverlay.classList.remove('hidden');
                if (winner) {
                    ui.winnerDisplay.textContent = winner.avatar;
                    ui.winnerName.textContent = winner.name + ' の勝利！';
                    if(winner.element) {
                        winner.element.style.transform = 'translate(-50%, -50%) scale(3)';
                        winner.element.style.zIndex = '100';
                    }
                } else {
                     ui.winnerDisplay.textContent = '💀';
                     ui.winnerName.textContent = '相打ち...勝者なし';
                }
            }, 1000);
        }

        let lastSortTime = 0;
        function updateListOrder() {
            if (gameTime - lastSortTime < 1000) return;
            lastSortTime = gameTime;

            const listElements = Array.from(ui.characterList.children);
            listElements.sort((a, b) => {
                const charA = characters.find(c => `list_${c.id}` === a.id);
                const charB = characters.find(c => `list_${c.id}` === b.id);
                if (!charA || !charB) return 0;
                
                if (charA.isAlive !== charB.isAlive) return charA.isAlive ? -1 : 1;
                return (charB.hp / charB.maxHp) - (charA.hp / charA.maxHp);
            });
            listElements.forEach(el => ui.characterList.appendChild(el));
        }

        function openEditor(char) {
            let targetChar = char.isMinion ? characters.find(c => c.id === char.teamId) : char;
            if(!targetChar) return;

            editingCharId = targetChar.id;
            ui.editAvatar.textContent = targetChar.avatar;
            ui.editName.textContent = targetChar.name;
            ui.editAtk.value = Math.floor(targetChar.atk);
            ui.editMaxHp.value = Math.floor(targetChar.maxHp);
            ui.editSpd.value = targetChar.speed.toFixed(1);
            ui.editSkill.value = targetChar.skill;
            
            Array.from(ui.characterList.children).forEach(el => el.classList.remove('border-blue-500', 'bg-gray-600'));
            if(targetChar.listItemElement) targetChar.listItemElement.classList.add('border-blue-500', 'bg-gray-600');
            ui.editorPanel.classList.remove('hidden');
        }

        function saveEditor() {
            if (!editingCharId) return;
            const char = characters.find(c => c.id === editingCharId);
            if (!char) return;

            const values = [ui.editAtk.value, ui.editMaxHp.value, ui.editSpd.value].map(Number);
            if (values.some(v => !Number.isFinite(v) || v <= 0) || values[2] > 200) {
                alert('攻撃力・体力・速度には正の数を入力してください。速度の上限は200です。');
                return;
            }
            const oldMaxHp = char.maxHp;
            const oldSkill = char.skill;
            
            char.atk = values[0];
            let editedMaxHp = Math.max(1, Math.round(values[1]));
            // エディタからの入力も最大値200で制限
            char.speed = values[2];
            const newSkill = ui.editSkill.value;
            
            if (!SUPPORT_SKILLS.includes(oldSkill) && SUPPORT_SKILLS.includes(newSkill)) {
                editedMaxHp *= 1.5;
            } else if (SUPPORT_SKILLS.includes(oldSkill) && !SUPPORT_SKILLS.includes(newSkill)) {
                editedMaxHp /= 1.5;
            }
            if (char.skill === 'giant' && newSkill !== 'giant') { char.radius = 16; char.element.style.width = '32px'; char.element.style.height = '32px'; char.element.style.fontSize = '24px'; editedMaxHp /= 2.5; char.atk /= 2.0; char.speed /= 0.8; }
            if (newSkill === 'giant' && oldSkill !== 'giant') { char.radius = 36; char.element.style.width = '72px'; char.element.style.height = '72px'; char.element.style.fontSize = '54px'; editedMaxHp *= 2.5; char.atk *= 2.0; char.speed *= 0.8; }
            
            if (oldSkill === 'super_knockback' && newSkill !== 'super_knockback') char.atk /= 1.5;
            if (newSkill === 'super_knockback' && oldSkill !== 'super_knockback') char.atk *= 1.5;
            
            char.maxHp = editedMaxHp;
            char.skill = newSkill;
            if (oldSkill === 'extra_life' && newSkill !== 'extra_life') char.maxHp /= 0.8;
            if (newSkill === 'extra_life' && oldSkill !== 'extra_life') char.maxHp *= 0.8;
            if (oldSkill === 'bike_ride' && newSkill !== 'bike_ride') char.speed /= 1.5;
            if (newSkill === 'bike_ride' && oldSkill !== 'bike_ride') char.speed *= 1.5;
            char.speed = Math.min(char.speed, 200);
            if (newSkill !== oldSkill) {
                char.shield = newSkill === 'shield' ? char.maxHp * 0.5 : 0;
                char.maxShield = char.shield;
                char.bikeHp = newSkill === 'bike_ride' ? char.maxHp * 1.5 : 0;
                char.avatar = newSkill === 'bike_ride' ? '🏍️' : AVATARS[Math.floor(mulberry32(cyrb53(char.name, cyrb53(JSON.stringify(parseNames(ui.nameInput.value).sort()))))() * AVATARS.length)];
                char.isUnderground = false;
                char.isInvincible = false;
                char.lastSkills = {};
            }
            char.isFlying = (newSkill === 'flying');
            if (newSkill !== oldSkill) char.hasExtraLife = (newSkill === 'extra_life');

            customStats.set(char.name, {
                atk: char.atk,
                maxHp: char.maxHp,
                speed: char.speed,
                skill: char.skill
            });

            if (char.maxHp > oldMaxHp) char.hp += (char.maxHp - oldMaxHp);
            else if (char.hp > char.maxHp) char.hp = char.maxHp;

            saveSettings();
            if (char.element) char.element.firstChild.textContent = `\n                    ${char.avatar}\n                    `;
            char.normalizeSpeed();
            char.lastListUpdate = -Infinity;
            char.updateUI();
            ui.editorPanel.classList.add('hidden');
        }

        ui.restartBtn.addEventListener('click', () => {
            ui.gameOverOverlay.classList.add('hidden');
            ui.startOverlay.classList.remove('hidden');
            ui.shuffleBtn.disabled = false;
            resizeBattlefield();
        });
        ui.pauseBtn.addEventListener('click', () => {
            if (ui.pauseBtn.disabled) return;
            isPlaying = !isPlaying;
            if (isPlaying) startLoop(); else stopLoop();
            ui.pauseBtn.textContent = isPlaying ? '一時停止' : '再開';
            ui.pauseBtn.className = isPlaying 
                ? 'px-4 py-2 bg-yellow-600 hover:bg-yellow-500 text-white font-bold rounded shadow'
                : 'px-4 py-2 bg-green-600 hover:bg-green-500 text-white font-bold rounded shadow';
        });
        ui.stopBtn.addEventListener('click', () => {
            isPlaying = false;
            stopLoop();
            clearTimeout(resultTimer);
            simulationTimers.clear();
            clearTimeout(debounceTimer);
            ui.timeStopOverlay.classList.add('hidden');
            ui.battlefield.classList.add('hidden');
            ui.startOverlay.classList.remove('hidden');
            ui.editorPanel.classList.add('hidden');
            ui.stopBtn.classList.add('hidden');
            ui.pauseBtn.disabled = true;
            ui.shuffleBtn.disabled = false;
        });

        ui.shuffleBtn.addEventListener('click', () => {
            const inputText = ui.nameInput.value.trim();
            if (!inputText) return;
            const names = parseNames(inputText);
            if (names.length > MAX_PLAYERS) return false;
            if (names.length < 2) return;
            
            let availableSkills = [...SKILLS.filter(s => s.id !== 'none')];
            
            names.forEach(name => {
                const basePool = Math.random();
                let atk, maxHp, speed;
                if (basePool < 0.33) { atk = 15 + Math.random() * 10; maxHp = 1000 + Math.random() * 200; speed = 4.5 + Math.random() * 1.5; }
                else if (basePool < 0.66) { atk = 8 + Math.random() * 10; maxHp = 1200 + Math.random() * 300; speed = 4.0 + Math.random() * 1.0; }
                else { atk = 10 + Math.random() * 8; maxHp = 1000 + Math.random() * 150; speed = 5.5 + Math.random() * 1.5; }
                
                if(availableSkills.length === 0) availableSkills = [...SKILLS.filter(s => s.id !== 'none')];
                const idx = Math.floor(Math.random() * availableSkills.length);
                const skill = availableSkills[idx].id;
                availableSkills.splice(idx, 1);

                let finalMaxHp = maxHp;
                if (skill === 'giant') { finalMaxHp *= 2.5; atk *= 2.0; speed *= 0.8; }
                if (skill === 'super_knockback') { atk *= 1.5; }
                if (SUPPORT_SKILLS.includes(skill)) { finalMaxHp *= 1.5; }
                if (skill === 'extra_life') { finalMaxHp *= 0.8; }
                
                customStats.set(name, { atk: atk, maxHp: finalMaxHp, speed: speed, skill: skill });
            });
            
            saveSettings();
            prepareGame();
            
            characters.forEach(c => {
                if(!c.isMinion) createEffect('effect-text text-purple-400 font-bold', c.x, c.y, 'SHUFFLE!', 1000);
            });
        });

        ui.closeEditorBtn.addEventListener('click', () => {
            ui.editorPanel.classList.add('hidden');
            Array.from(ui.characterList.children).forEach(el => el.classList.remove('border-blue-500', 'bg-gray-600'));
        });
        ui.saveEditBtn.addEventListener('click', saveEditor);

        document.getElementById('speed-select').addEventListener('change', e => {
            playbackSpeed = Number(e.target.value);
        });
        document.getElementById('sample-btn').addEventListener('click', () => {
            ui.nameInput.value = SAMPLE_NAMES;
            updateInputStatus(); saveSettings(); prepareGame();
        });
        document.getElementById('reset-stats-btn').addEventListener('click', () => {
            customStats.clear(); saveSettings(); prepareGame();
        });
        document.addEventListener('visibilitychange', () => {
            if (document.hidden && isPlaying) ui.pauseBtn.click();
        });
        document.addEventListener('keydown', e => {
            if (e.target.closest('input, textarea, select, button')) return;
            if (e.code === 'Space' && !ui.pauseBtn.disabled) { e.preventDefault(); ui.pauseBtn.click(); }
            if (e.code === 'Escape') ui.closeEditorBtn.click();
        });
        window.onload = () => {
            ui.nameInput.value = SAMPLE_NAMES;
            try {
                const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
                if (saved && typeof saved.names === 'string') ui.nameInput.value = saved.names;
                if (saved && Array.isArray(saved.stats)) {
                    for (const entry of saved.stats) {
                        if (!Array.isArray(entry) || entry.length !== 2) continue;
                        const [name, stats] = entry;
                        if (typeof name === 'string' && stats && [stats.atk, stats.maxHp, stats.speed].every(v => Number.isFinite(v) && v > 0) && stats.speed <= 200 && SKILLS.some(skill => skill.id === stats.skill)) customStats.set(name, stats);
                    }
                }
            } catch (error) { console.warn('保存設定を読み込めませんでした', error); }
            updateInputStatus(); prepareGame(); resizeBattlefield();
        };

    </script>
</body>
</html>
